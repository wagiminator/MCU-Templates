; ===================================================================================
; PlatformIO Project Configuration File
; ===================================================================================
; Project:  Example for megaAVR 0-series
; Author:   Stefan Wagner
; Year:     2026
; URL:      https://github.com/wagiminator
; ===================================================================================
; Supported boards: ATmega808, ATmega809, ATmega1608, ATmega1609, ATmega3208,
;                   ATmega3209, ATmega4808, ATmega4809 (MegaCoreX)
; ===================================================================================

[env:ATmega4808]
platform = atmelmegaavr
board = ATmega4808
framework = arduino

board_build.mcu     = atmega4808
board_build.f_cpu   = 5000000L
board_build.use_lto = yes
board_build.variant = 32pin-standard
board_fuses.wdtcfg  = 0x00
board_fuses.bodcfg  = 0x00
board_fuses.osccfg  = 0x02
board_fuses.syscfg0 = 0xC9
board_fuses.syscfg1 = 0x04
board_fuses.append  = 0x00
board_fuses.bootend = 0x00
build_flags = -I.
