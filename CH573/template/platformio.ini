; ===================================================================================
; PlatformIO Project Configuration File
; ===================================================================================
; Project:  CH573/CH571 Example
; Author:   Stefan Wagner
; Year:     2026
; URL:      https://github.com/wagiminator
; ===================================================================================
; Install PlatformIO and CH32V:
; https://pio-ch32v.readthedocs.io/en/latest/
; https://github.com/Community-PIO-CH32V/platform-ch32v
; ===================================================================================

[env:CH573]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = genericCH573F

build_flags = -I. -D F_CPU=60000000
board_build.ldscript = $PROJECT_DIR/ld/ch573.ld
board_build.use_lto = yes

; When using Bluetooth LE (ble_handler.c in src), copy the blobs folder into the
; project folder and uncomment the following line:
; build_flags = -I. -I$PROJECT_DIR/blobs -D F_CPU=60000000 -L$PROJECT_DIR/blobs -l:LIBCH57xBLE.a
